<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Firma de formadores · Robotech</title><style>
    :root { --red:#d71920; --red-dark:#9f1016; --ink:#17191d; --ink-soft:#343941; --muted:#626b76; --line:#dfe3e8; --paper:#fff; --soft:#f5f6f7; --soft-red:#fff3f4; --shadow:0 8px 22px rgba(17,24,39,.08); }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 10% 8%, rgba(215,25,32,.075), transparent 28rem), #f7f8f9; color:var(--ink); font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height:1.55; }
    a { color:inherit; }
    .container { width:min(1180px, calc(100% - 32px)); margin:0 auto; }
    .site-header { position:sticky; top:0; z-index:50; border-bottom:1px solid rgba(217,221,227,.92); background:rgba(255,255,255,.94); backdrop-filter:blur(14px); }
    .nav { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:68px; }
    .brand { display:inline-flex; align-items:center; gap:10px; color:var(--ink); font-weight:800; text-decoration:none; }
    .brand-mark { display:grid; width:38px; height:38px; place-items:center; border:2px solid var(--red); border-radius:6px; color:var(--red); font-weight:900; line-height:1; }
    .brand small { display:block; color:#6b7280; font-size:.74rem; font-weight:600; }
    .nav-actions { display:flex; gap:10px; align-items:center; }
    main { padding:42px 0 78px; }
    main > section:first-child { margin-bottom:4px; }
    h1,h2,h3 { color:#0c0d10; line-height:1.08; }
    h1 { margin:0; font-size:clamp(2.2rem, 4.5vw, 4rem); }
    .eyebrow { margin:0 0 12px; color:var(--red); font-size:.78rem; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .lead { max-width:760px; color:var(--muted); font-size:1.08rem; }
    .panel, .card, .workshop { border:1px solid var(--line); border-radius:10px; background:#fff; box-shadow:var(--shadow); }
    .panel { padding:28px; margin-top:24px; }
    .card { padding:22px; }
    .card > h2, .panel > h2, .card > .eyebrow + h2 { margin-top:0; }
    .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
    .dashboard { display:grid; grid-template-columns:minmax(0, .96fr) minmax(0, 1.04fr); gap:22px; align-items:start; margin-top:26px; }
    label { display:grid; gap:7px; color:var(--ink-soft); font-weight:800; }
    input, textarea, select { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font:inherit; transition:border-color .16s ease, box-shadow .16s ease; }
    input:focus, textarea:focus, select:focus { outline:0; border-color:rgba(215,25,32,.5); box-shadow:0 0 0 4px rgba(215,25,32,.09); }
    button, .button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 16px; border:1px solid transparent; border-radius:7px; background:var(--red); color:#fff; cursor:pointer; font:inherit; font-weight:850; text-decoration:none; transition:background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
    button:hover, .button:hover { background:var(--red-dark); transform:translateY(-1px); box-shadow:0 10px 22px rgba(215,25,32,.16); }
    button.secondary, .button.secondary { border-color:var(--line); background:#fff; color:var(--ink); }
    button.secondary:hover, .button.secondary:hover { border-color:#c9ced6; background:#fff; }
    .button-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .muted, .small { color:var(--muted); }
    .small { font-size:.9rem; }
    .status { min-height:24px; margin:12px 0 0; color:var(--muted); font-weight:800; }
    .status.error { color:var(--red-dark); }
    .status.ok { color:var(--red); }
    .attendee-row, .resource-row { border:1px solid #eaecf0; border-radius:8px; padding:12px; margin-bottom:10px; background:#fcfcfd; }
    .create-hint { margin:10px 0 0; padding:12px 14px; border:1px solid var(--line); border-left:4px solid var(--red); border-radius:8px; background:var(--soft); color:var(--muted); font-size:.92rem; font-weight:700; }
    .admin-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; padding:12px; border:1px solid var(--line); border-radius:8px; background:linear-gradient(180deg,#fff,var(--soft)); }
    .admin-toolbar label { flex:1 1 240px; }
    .people-table { display:grid; gap:8px; margin-top:12px; }
    .people-row { display:grid; grid-template-columns:minmax(110px,.8fr) minmax(150px,1fr) minmax(190px,1.1fr) auto; gap:8px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .people-row input { margin:0; }
    .people-row.is-hidden { display:none; }
    .table-head { color:var(--muted); font-size:.78rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; background:transparent; border:0; padding:0 10px; }
    .bulk-box { display:none; gap:10px; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .bulk-box.is-open { display:grid; }
    .workshop { overflow:hidden; margin-bottom:14px; border-left:5px solid var(--red); transition:border-color .16s ease, box-shadow .16s ease; }
    .workshop:hover { border-left-color:var(--red-dark); box-shadow:0 14px 34px rgba(17,24,39,.10); }
    .workshop-body { padding:18px; }
    .summary { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin:12px 0; }
    .metric { min-height:82px; padding:13px; border:1px solid var(--line); border-radius:8px; background:linear-gradient(180deg,#fff,var(--soft)); }
    .metric strong { display:block; color:#0c0d10; font-size:1.35rem; }
    .classroom-scroll { overflow:auto; padding-bottom:4px; }
    .classroom-grid { display:grid; width:fit-content; min-width:max-content; gap:6px; margin-top:10px; }
    .seat { display:grid; width:38px; height:34px; place-items:center; border:1px solid #c8ced8; border-radius:7px; background:#fff; font-weight:900; font-size:.9rem; }
    .seat.free { border-color:#abefc6; background:#ecfdf3; color:#087443; }
    .seat.occupied { border-color:var(--red); background:var(--red); color:#fff; }
    .seat.aisle { border:0; background:transparent; }
    .resources-list { display:grid; gap:8px; margin:12px 0; }
    .resource-chip { display:grid; gap:2px; padding:11px 13px; border:1px solid var(--line); border-left:4px solid var(--red); border-radius:8px; background:#fff; }
    .resource-chip a { color:var(--red-dark); font-weight:850; text-decoration:none; overflow-wrap:anywhere; }
    .resource-chip span { color:var(--muted); font-size:.88rem; }
    .resource-row { display:grid; gap:10px; }
    .resource-row .resource-grid { display:grid; grid-template-columns:minmax(120px,.6fr) minmax(160px,1fr); gap:10px; }
    .resource-row textarea { min-height:90px; }
    .edit-shell { display:grid; gap:18px; margin-top:16px; }
    @media (max-width:980px) { .dashboard, .grid { grid-template-columns:1fr; } }
    @media (max-width:820px) { .people-row, .resource-row .resource-grid { grid-template-columns:1fr; } .table-head { display:none; } }
    @media (max-width:700px) { .container { width:calc(100% - 24px); } .brand small { display:none; } .nav { align-items:flex-start; flex-direction:column; padding:12px 0; } .nav-actions, button, .button { width:100%; } .summary { grid-template-columns:1fr; } .panel, .card { padding:20px; } h1 { font-size:2.25rem; } }
  </style></head>
<body><main class="container" style="max-width:680px"><p class="eyebrow">Robotech · Formadores</p><h1>Firma de asistencia</h1><p class="lead">Acceso para los formadores inscritos en el taller. No necesitas reservar un puesto.</p>
<section class="panel"><form id="lookup"><label>Código del taller<input id="code" required pattern="[A-Za-z0-9_-]{3,24}" autocomplete="off"></label><label>DNI<input id="dni" required autocomplete="off"></label><button style="margin-top:16px">Comprobar datos</button></form>
<div id="confirmation" hidden><h2 id="workshopTitle"></h2><p id="details"></p><label style="display:flex;align-items:center"><input id="consent" type="checkbox" style="width:auto">Confirmo que soy esta persona y que he impartido este taller.</label><button id="sign" style="margin-top:16px">Firmar como formador</button></div><p id="status" role="status" aria-live="polite"></p></section></main>
<script type="module">
import {db} from './firebase.js';
import {doc,getDoc,runTransaction} from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';
const byId = id => document.getElementById(id);
byId('code').value = new URLSearchParams(location.search).get('workshop') || '';
let identity = null;
byId('lookup').onsubmit = async event => {
  event.preventDefault(); identity = null; byId('confirmation').hidden = true; byId('consent').checked = false;
  const button = event.submitter; button.disabled = true; byId('status').textContent = 'Comprobando…';
  try {
    const code = byId('code').value.trim().toUpperCase(), dni = byId('dni').value.trim().toUpperCase();
    const snap = await getDoc(doc(db,'workshops',code));
    if(!snap.exists()) throw new Error('No existe este taller.');
    const ws = snap.data(), person = (ws.trainers || []).find(p => p.dni.toUpperCase() === dni);
    if(!person) throw new Error('No estás inscrito como formador. Contacta con el administrador.');
    if((ws.trainerSignatures || []).some(p => p.dni === person.dni)) { byId('status').textContent = 'Tu asistencia como formador ya está firmada.'; return; }
    identity = {code,dni:person.dni};
    byId('workshopTitle').textContent = ws.title || code;
    byId('details').textContent = [person.name,person.email,ws.place,ws.schedule].filter(Boolean).join(' · ');
    byId('confirmation').hidden = false; byId('status').textContent = '';
  } catch(err) { byId('status').textContent = err.message; }
  finally { button.disabled = false; }
};
byId('sign').onclick = async () => {
  if(!identity || !byId('consent').checked) { byId('status').textContent = 'Confirma tus datos antes de firmar.'; return; }
  byId('sign').disabled = true; byId('lookup').querySelector('button').disabled = true;
  const personId = {...identity};
  try {
    await runTransaction(db, async tx => {
      const target = doc(db,'workshops',personId.code), snap = await tx.get(target);
      if(!snap.exists()) throw new Error('El taller ya no existe.');
      const ws = snap.data(), person = (ws.trainers || []).find(p => p.dni === personId.dni);
      if(!person) throw new Error('Ya no estás inscrito como formador.');
      const signatures = ws.trainerSignatures || [];
      if(signatures.some(p => p.dni === person.dni)) return;
      tx.update(target,{trainerSignatures:[...signatures,{dni:person.dni,name:person.name,email:person.email,signed:true,timestamp:new Date().toISOString()}]});
    });
    byId('confirmation').hidden = true; identity = null;
    byId('status').textContent = 'Asistencia firmada correctamente. Ya puedes cerrar esta página.';
  } catch(err) { byId('status').textContent = 'No se pudo guardar la firma: ' + err.message; }
  finally { byId('sign').disabled = false; byId('lookup').querySelector('button').disabled = false; }
};
for(const id of ['code','dni']) byId(id).oninput = () => { identity = null; byId('confirmation').hidden = true; };
</script></body></html>
